<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — Zero Nine Trading</title>
<meta name="description" content="Browse every organic, gluten-free, no-added-sugar and natural product we stock in Cyprus. Filter by diet, brand, department and price.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="zn-header"></div>

<main id="main">
  <div class="pagehead">
    <div class="wrap" data-animate="fade-up">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span>/</span><span data-crumb>Shop</span>
      </nav>
      <h1 data-shop-title>Shop</h1>
      <p class="section__lead" data-shop-lead>Everything we hold in the Latsia warehouse, updated as stock moves.</p>
    </div>
  </div>

  <div class="wrap shop-layout">

    <aside class="filters" data-filters aria-label="Filters">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <h3 style="margin:0">Filters</h3>
        <button class="btn btn--ghost btn--sm" data-clear-filters>Clear all</button>
      </div>

      <div class="filters__group">
        <h3>Diet</h3>
        <div data-filter-diets></div>
      </div>

      <div class="filters__group">
        <h3>Department</h3>
        <div data-filter-cats></div>
      </div>

      <div class="filters__group">
        <h3>Brand</h3>
        <div data-filter-brands></div>
      </div>

      <div class="filters__group">
        <h3>Price</h3>
        <div class="range-row">
          <input type="number" min="0" step="0.5" placeholder="Min" data-price-min aria-label="Minimum price">
          <span>—</span>
          <input type="number" min="0" step="0.5" placeholder="Max" data-price-max aria-label="Maximum price">
        </div>
      </div>

      <div class="filters__group">
        <h3>Availability</h3>
        <label class="check"><input type="checkbox" data-instock> In stock only</label>
        <label class="check"><input type="checkbox" data-onsale> Reduced price</label>
      </div>

      <button class="btn btn--primary btn--block" style="margin-top:22px" data-close-filters>Show results</button>
    </aside>

    <div>
      <div class="shop-bar">
        <div class="shop-bar__count" data-count></div>
        <div style="display:flex;gap:10px;align-items:center">
          <button class="btn btn--ghost btn--sm filters-toggle" data-open-filters>Filters</button>
          <label class="sr-only" for="zn-sort">Sort by</label>
          <select class="select" id="zn-sort" data-sort>
            <option value="popular">Most popular</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="name">Name A–Z</option>
            <option value="rating">Best rated</option>
          </select>
        </div>
      </div>

      <div class="chips" data-chips></div>
      <div class="grid-products" data-results></div>
      <div style="text-align:center;margin-top:32px">
        <button class="btn btn--ghost" data-more hidden>Load more</button>
      </div>
    </div>

  </div>
</main>

<div id="zn-footer"></div>

<script src="assets/js/products.js"></script>
<script src="assets/js/content.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/packshot.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/shop.js"></script>
</body>
</html>
